rules:
  - id: sismosmart-unsafe-raw-jsonld
    languages: [typescript]
    severity: ERROR
    message: Serialize JSON-LD with the HTML-safe serializer instead of raw JSON.stringify.
    paths:
      include: [src/components/structured-data.tsx]
    pattern: JSON.stringify($DATA)

  - id: sismosmart-disable-node-tls-verification
    languages: [javascript, typescript]
    severity: ERROR
    message: Disabling Node.js TLS verification is forbidden.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0

  - id: sismosmart-dynamic-code-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid runtime evaluation of dynamically assembled JavaScript.
    pattern-either:
      - pattern: eval($EXPRESSION)
      - pattern: new Function(...)

  - id: sismosmart-dom-html-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid direct innerHTML writes in application or operational code.
    pattern: $TARGET.innerHTML = $DATA
