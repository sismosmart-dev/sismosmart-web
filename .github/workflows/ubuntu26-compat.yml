name: Ubuntu 26.04 Compatibility

# On-demand migration evidence. Deliberately does not change production runners,
# run on a schedule, access secrets, or activate deployment operations.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ubuntu26-compat.yml

permissions:
  contents: read

concurrency:
  group: ubuntu26-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu26:
    name: compatibility/ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
      NEXT_PUBLIC_CLARITY_ID: BROWSERTEST
      NEXT_PUBLIC_GA_ID: G-BROWSERTEST
      NEXT_PUBLIC_GTM_ID: GTM-BROWSERTEST
    steps:
      - name: Checkout candidate commit without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify pinned Ubuntu runner and deployment utility availability
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "26.04"
          for tool in curl openssl ssh tar gzip git docker; do
            command -v "$tool" >/dev/null
          done
          curl --version | head -1
          openssl version
          ssh -V
          tar --version | head -1
          docker --version
          echo "UBUNTU26_TOOLCHAIN_PASS=true"

      - name: Setup required Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Clean installation and project checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm audit --audit-level=high

      - name: Build production bundle and verify Passenger-compatible startup locally
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run deploy:prepare
          npm run deploy:smoke
          test -f .deploy/standalone/app.js
          test -d .deploy/standalone/.next/static
          test -d .deploy/standalone/public

      - name: Install pinned Chrome test runtime and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm run browser:install
          sudo ./node_modules/.bin/browsers install chrome-headless-shell@150.0.7871.24 --path "$PWD/.cache/puppeteer" --install-deps

      - name: Run browser, accessibility and form checks without delivery
        run: npm run test:browser

      - name: Verify public DNS, HTTPS certificate and form discovery without credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/public-dns-mail.mjs
          node scripts/ops/public-health.mjs
          # Strict TLS verification is the default; never use -k or --insecure.
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null https://sismosmart.com/en
          echo "PUBLIC_NETWORK_TLS_DNS_COMPATIBILITY_PASS=true"

      - name: Scan dependency and source security in isolated containers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --verbose
          docker run --rm --network=none \
            -e SEMGREP_SEND_METRICS=off \
            -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b \
            semgrep scan --config .semgrep/security.yml --strict --error --metrics=off .

      - name: Verify exact tested SHA and no remote deployment
        shell: bash
        run: |
          set -euo pipefail
          # On PRs GITHUB_SHA is the tested synthetic merge commit;
          # on workflow_dispatch it is the exact selected ref.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .deploy/standalone/app.js
          echo "NON_ACTIVATING_UBUNTU26_CANDIDATE_PASS=true"
