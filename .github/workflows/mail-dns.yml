name: Mail DNS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-dns-audit
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  audit:
    name: ops/mail-dns
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and mask Doppler prd_sismosmart secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534  # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Verify scoped Doppler prd_sismosmart grant
        run: node scripts/ops/check-fetched-doppler.mjs prd_sismosmart

      - name: Audit MX, SPF, DKIM, DMARC, and SMTP TLS
        run: npm run ops:mail-dns -- --output .artifacts/mail-dns-report.json

      - name: Upload mail DNS report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mail-dns-${{ github.run_id }}
          path: .artifacts/mail-dns-report.json
          if-no-files-found: error
          retention-days: 14
