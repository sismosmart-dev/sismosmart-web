name: Production Health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      capacity_diagnostics:
        description: "Include sanitized read-only capacity diagnostics"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-health
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: "22.18.0"

jobs:
  audit:
    name: ops/production-health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PUBLIC_BASE_URL: https://sismosmart.com
      PRODUCTION_HEALTH_OUTPUT: .artifacts/production-health.json
      PRODUCTION_HEALTH_CAPACITY_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.capacity_diagnostics || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and mask Doppler prd_ops secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534  # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD_OPS }}
          inject-env-vars: true

      - name: Verify scoped Doppler prd_ops grant
        run: node scripts/ops/check-fetched-doppler.mjs prd_ops

      - name: Validate required read-only audit secrets
        shell: bash
        run: |
          missing=()
          for name in DOMAIN SSH_HOST SSH_PORT SSH_USER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ -z "${SSH_PRIVATE_KEY_BASE64:-}" ] && [ -z "${SSH_PASSWORD:-}" ]; then
            missing+=("SSH_PRIVATE_KEY_BASE64 (preferred) or SSH_PASSWORD")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production health secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Run production health audit
        run: npm run ops:production-health

      - name: Upload production health report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: production-health-${{ github.run_id }}
          path: .artifacts/production-health.json
          if-no-files-found: warn
          retention-days: 14
