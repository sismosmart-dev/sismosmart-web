name: Public Health

# Can replace scheduled public-facing checks without giving an unattended
# workflow the unified production Doppler token or privileged SSH/cPanel keys.
# The schedule remains inert until the old monitoring handoff is accepted.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: public-health
  cancel-in-progress: false

jobs:
  probe:
    name: ops/public-health
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.SISMOSMART_PUBLIC_MONITOR_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 7
    steps:
      - name: Checkout approved main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.18.0"

      - name: Audit public routes and form configuration via HTTPS GET only
        run: node scripts/ops/public-health.mjs
