name: DNS Cutover Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-cutover-audit
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  audit:
    name: ops/dns-cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and mask Doppler prd_sismosmart secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534  # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Verify scoped Doppler prd_sismosmart grant
        run: node scripts/ops/check-fetched-doppler.mjs prd_sismosmart

      - name: Audit delegation, resolver propagation, service DNS, and TLS
        run: npm run ops:dns-cutover -- --output .artifacts/dns-cutover-report.json

      - name: Upload DNS cutover report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dns-cutover-${{ github.run_id }}
          path: .artifacts/dns-cutover-report.json
          if-no-files-found: error
          retention-days: 14
