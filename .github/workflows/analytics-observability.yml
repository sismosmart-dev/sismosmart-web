name: Analytics Observability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-observability
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  audit:
    name: ops/analytics-observability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-deploy
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and mask Doppler main secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534  # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Verify scoped Doppler main grant
        run: node scripts/ops/check-fetched-doppler.mjs main

      - name: Record canonical configuration status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/analytics
          npm run --silent ops:status > .artifacts/analytics/ops-status.json
          npm run --silent ops:clarity -- status > .artifacts/analytics/clarity-status.json

      - name: Verify Google administrative resources
        run: >-
          npm run ops:analytics-admin-audit -- --output-dir .artifacts/analytics

      - name: Audit consent, tag loading, and form events in every locale
        env:
          ANALYTICS_AUDIT_BASE_URL: https://sismosmart.com
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: >-
          npm run ops:analytics-audit --
          --output .artifacts/analytics/browser-audit.json

      - name: Upload analytics observability report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: analytics-observability-${{ github.run_id }}
          path: .artifacts/analytics
          if-no-files-found: error
          retention-days: 14
