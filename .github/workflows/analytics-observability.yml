name: Analytics Observability

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  schedule:
    - cron: "27 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-observability
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"
  DOPPLER_PROJECT: "sismosmart-web"
  DOPPLER_CONFIG: "prd_ops"

jobs:
  audit:
    name: ops/analytics-observability
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1  # v3

      - name: Install dependencies
        run: npm ci

      - name: Validate read-only operations inventory
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD_OPS }}
        run: npm run doppler:check -- --doppler prd_ops

      - name: Record canonical configuration status
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD_OPS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/analytics
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" -- npm run --silent ops:status > .artifacts/analytics/ops-status.json
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" -- npm run --silent ops:clarity -- status > .artifacts/analytics/clarity-status.json

      - name: Verify Google administrative resources
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD_OPS }}
        run: >-
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" --
          npm run ops:analytics-admin-audit -- --output-dir .artifacts/analytics

      - name: Audit consent, tag loading, and form events in every locale
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD_OPS }}
          ANALYTICS_AUDIT_BASE_URL: https://sismosmart.com
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: >-
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" --
          npm run ops:analytics-audit --
          --output .artifacts/analytics/browser-audit.json

      - name: Upload analytics observability report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: analytics-observability-${{ github.run_id }}
          path: .artifacts/analytics
          if-no-files-found: error
          retention-days: 14
